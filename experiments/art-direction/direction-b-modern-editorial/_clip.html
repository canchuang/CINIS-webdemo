<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F2F4F7}iframe{display:block;border:0;background:#F2F4F7}</style>
</head><body>
<iframe id="f"></iframe>
<script>
var q=new URLSearchParams(location.search);
var p=q.get('p')||'mova.html';
var w=q.get('w')||'1440', h=q.get('h')||'1000';
var id=q.get('id')||'';
var f=document.getElementById('f');
f.style.width=w+'px'; f.style.height=h+'px';
f.onload=function(){
  try{
    if(id){ var d=f.contentDocument; var el=d.getElementById(id); if(el){ el.scrollIntoView({block:'start'}); } }
  }catch(e){ /* cross-origin */ }
};
f.src=p;
</script>
</body></html>

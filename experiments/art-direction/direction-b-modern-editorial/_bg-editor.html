<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>光幕 / 流光 颜色循环编辑器</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hero-bg.css">
<style>
  :root{--line:#CCD3DC;--ink:#11151B;--text2:#5E6773;--accent:#6552D6;--base:#F2F4F7}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:#F7F8FA}
  .top{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#fff}
  h1{font-family:'Space Grotesk','PingFang SC',sans-serif;font-size:22px;margin:0}
  .sub{font-family:'Space Grotesk',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
  .layout{display:grid;grid-template-columns:360px 1fr;gap:26px;padding:24px 28px 60px;max-width:1280px;margin:0 auto}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
  .panel h2{font-size:13px;margin:0 0 14px;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);font-family:'Space Grotesk',sans-serif}
  .field{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;margin:10px 0;font-size:13px}
  .field label{color:var(--text2)}
  input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
  input[type=range]{width:100%}
  .val{font-family:'Space Grotesk',monospace;font-size:12px;color:var(--ink);min-width:52px;text-align:right}
  .chip{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid #0002;vertical-align:middle;margin-right:6px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  button{font:inherit;font-size:13px;padding:9px 14px;border:1px solid var(--ink);background:#fff;border-radius:8px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:hover{opacity:.9}
  .preview{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .pv{position:relative;height:300px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--base)}
  .pv-layer{position:absolute;inset:0}
  .pv .cap{position:absolute;left:10px;bottom:10px;z-index:5;font-family:'Space Grotesk',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#414955;background:rgba(255,255,255,.75);padding:4px 8px;border-radius:5px}
  pre{background:#0f141a;color:#cfe3ff;padding:14px;border-radius:10px;font-size:12px;line-height:1.6;overflow:auto;max-height:260px}
  .note{font-size:12px;color:var(--text2);margin-top:12px;line-height:1.6}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.preview{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div><h1>光幕 / 流光 · 颜色循环编辑器</h1><div class="sub">React Bits Aurora &amp; Grainient · live preview</div></div>
  <div class="sub">本地预览 · 保存后刷新站点即全站生效</div>
</div>
<div class="layout">
  <div class="panel">
    <h2>色彩环（5 色，首尾自动闭合）</h2>
    <div class="field"><label><span class="chip" id="k0"></span>星云紫</label><input type="color" id="c0" value="#9876DA"><span class="val" id="v0">#9876DA</span></div>
    <div class="field"><label><span class="chip" id="k1"></span>雾蓝</label><input type="color" id="c1" value="#7199DB"><span class="val" id="v1">#7199DB</span></div>
    <div class="field"><label><span class="chip" id="k2"></span>青绿</label><input type="color" id="c2" value="#72C4BE"><span class="val" id="v2">#72C4BE</span></div>
    <div class="field"><label><span class="chip" id="k3"></span>霞粉</label><input type="color" id="c3" value="#CF8FBE"><span class="val" id="v3">#CF8FBE</span></div>
    <div class="field"><label><span class="chip" id="k4"></span>暖金</label><input type="color" id="c4" value="#DFBD87"><span class="val" id="v4">#DFBD87</span></div>
    <h2 style="margin-top:18px">节奏与强度</h2>
    <div class="field"><label>流光周期</label><input type="range" id="flowPeriod" min="14" max="32" step="1" value="20"><span class="val" id="flowPeriodV">20s</span></div>
    <div class="field"><label>光幕周期</label><input type="range" id="curtainPeriod" min="24" max="48" step="1" value="32"><span class="val" id="curtainPeriodV">32s</span></div>
    <div class="field"><label>流光饱和</label><input type="range" id="saturation" min="0.8" max="1.6" step="0.02" value="1.18"><span class="val" id="saturationV">1.18</span></div>
    <div class="field"><label>流光对比</label><input type="range" id="contrast" min="0.9" max="1.3" step="0.01" value="1.06"><span class="val" id="contrastV">1.06</span></div>
    <div class="field"><label>光幕不透明</label><input type="range" id="auroraOpacity" min="0.4" max="1" step="0.01" value="0.95"><span class="val" id="auroraOpacityV">0.95</span></div>
    <div class="actions">
      <button class="primary" id="apply">应用并保存到站点</button>
      <button id="reset">恢复默认</button>
      <button id="copyJson">复制 JSON</button>
      <button id="copyCss">复制 CSS 变量</button>
    </div>
    <div class="note" id="status">调整参数→右侧实时预览；点「应用并保存」后刷新首页/任意页即全站生效。</div>
  </div>
  <div class="panel">
    <h2>实时预览</h2>
    <div class="preview">
      <div class="pv"><div class="pv-layer" id="pvAurora"></div><span class="cap">光幕 · Aurora</span></div>
      <div class="pv"><div class="pv-layer" id="pvFlow"></div><span class="cap">流光 · Grainient</span></div>
    </div>
    <h2 style="margin-top:18px">导出</h2>
    <pre id="out"></pre>
  </div>
</div>
<script src="rb-shaders.js"></script>
<script src="hero-bg-canvas.js"></script>
<script>
(function(){
  var ids=['c0','c1','c2','c3','c4'];
  var D={ring:['#9876DA','#7199DB','#72C4BE','#CF8FBE','#DFBD87'],flowPeriod:20,curtainPeriod:32,saturation:1.18,contrast:1.06,auroraOpacity:.95};
  function $(id){return document.getElementById(id);}
  function colors(){return ids.map(function(id){return $(id).value.toUpperCase();});}
  function ringClosed(c){return c.concat([c[0]]);}
  function clear(l){l.innerHTML='';l.classList.remove('has-canvas');}
  function render(){
    colors().forEach(function(c,i){$('k'+i).style.background=c;$('v'+i).textContent=c;});
    var fp=+$('flowPeriod').value, cp=+$('curtainPeriod').value, sat=+$('saturation').value, con=+$('contrast').value, ao=+$('auroraOpacity').value;
    $('flowPeriodV').textContent=fp+'s';$('curtainPeriodV').textContent=cp+'s';$('saturationV').textContent=sat.toFixed(2);$('contrastV').textContent=con.toFixed(2);$('auroraOpacityV').textContent=ao.toFixed(2);
    var ring=ringClosed(colors());
    var RB=window.RB_BG;
    var la=$('pvAurora'); clear(la); var cc=colors();
    la.style.background='radial-gradient(58% 66% at 18% 14%,'+cc[0]+'cc 0%, transparent 70%),radial-gradient(52% 62% at 80% 12%,'+cc[1]+'cc 0%, transparent 72%),radial-gradient(56% 56% at 56% 58%,'+cc[2]+'cc 0%, transparent 72%),radial-gradient(50% 50% at 30% 82%,'+cc[3]+'bb 0%, transparent 70%)';
    la.style.opacity=String(ao);
    if(RB&&RB.initGrainient){clear($('pvFlow'));RB.initGrainient($('pvFlow'),{cycle:true,ring:ring,period:fp,saturation:sat,contrast:con});}
    window.__cfg={ring:colors(),flowPeriod:fp,curtainPeriod:cp,flowSaturation:sat,flowContrast:con,curtainOpacity:ao};
    $('out').textContent=JSON.stringify(window.__cfg,null,2);
  }
  ids.concat(['flowPeriod','curtainPeriod','saturation','contrast','auroraOpacity']).forEach(function(id){$(id).addEventListener('input',render);});
  $('apply').addEventListener('click',function(){try{localStorage.setItem('bgfx-config',JSON.stringify(window.__cfg));$('status').textContent='已保存。刷新首页（或任意页面）即全站生效。';}catch(e){$('status').textContent='保存失败：'+e.message;}});
  $('reset').addEventListener('click',function(){ids.forEach(function(id,i){$(id).value=D.ring[i];});$('flowPeriod').value=D.flowPeriod;$('curtainPeriod').value=D.curtainPeriod;$('saturation').value=D.saturation;$('contrast').value=D.contrast;$('auroraOpacity').value=D.auroraOpacity;render();});
  $('copyJson').addEventListener('click',function(){if(navigator.clipboard)navigator.clipboard.writeText(JSON.stringify(window.__cfg,null,2));$('status').textContent='已复制 JSON。';});
  $('copyCss').addEventListener('click',function(){var c=colors();var css=':root{\n  --bgfx-nebula:'+c[0]+'; --bgfx-fog:'+c[1]+'; --bgfx-jade:'+c[2]+'; --bgfx-blush:'+c[3]+'; --bgfx-gold:'+c[4]+';\n  --bgfx-flow-period:'+$('flowPeriod').value+'s; --bgfx-curtain-period:'+$('curtainPeriod').value+'s;\n}';if(navigator.clipboard)navigator.clipboard.writeText(css);$('status').textContent='已复制 CSS 变量。';});
  try{var c=JSON.parse(localStorage.getItem('bgfx-config')||'null');if(c&&Array.isArray(c.ring)){c.ring.slice(0,5).forEach(function(x,i){if(ids[i])$(ids[i]).value=x;});['flowPeriod','curtainPeriod'].forEach(function(k){if(typeof c[k]==='number')$(k).value=c[k];});if(typeof c.flowSaturation==='number')$('saturation').value=c.flowSaturation;if(typeof c.flowContrast==='number')$('contrast').value=c.flowContrast;if(typeof c.curtainOpacity==='number')$('auroraOpacity').value=c.curtainOpacity;}}catch(_){}
  render();
})();
</script>
</body>
</html>
